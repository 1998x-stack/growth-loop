<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
  <title id="title">挑战强度与有效学习程度的概念曲线</title>
  <desc id="desc">示意性的倒U形曲线，低挑战时可能只是重复，适度挑战且具备反馈和支持时学习更充分，极端挑战可能造成过载。并非实证拟合曲线或普适规律。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0C1426"/><stop offset="1" stop-color="#192B43"/></linearGradient>
    <linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#58E7C8" stop-opacity=".20"/><stop offset="1" stop-color="#58E7C8" stop-opacity="0"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9BB3CA"/></marker>
  </defs>
  <rect width="1080" height="660" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="52" y="67" font-size="30" font-weight="800" fill="#F4F8FF">Challenge × Effective Learning</text>
    <text x="52" y="103" font-size="20" fill="#B3C7D9">挑战强度与有效学习程度：概念示意，不是固定规律</text>
    <rect x="156" y="157" width="220" height="353" fill="#6580EB" fill-opacity=".09"/>
    <rect x="376" y="157" width="325" height="353" fill="#2BD6B4" fill-opacity=".11"/>
    <rect x="701" y="157" width="267" height="353" fill="#F6AF68" fill-opacity=".09"/>
    <g stroke="#43526B" stroke-width="1.2" stroke-dasharray="4 8">
      <path d="M156 250 H968 M156 340 H968 M156 430 H968"/>
    </g>
    <g fill="none" stroke="#9BB3CA" stroke-width="2.4" marker-end="url(#arrow)">
      <path d="M156 513 H995"/>
      <path d="M156 513 V146"/>
    </g>
    <path d="M174 481 C245 459 319 346 420 257 C501 188 604 176 672 225 C766 293 828 429 955 475 L955 510 L174 510 Z" fill="url(#area)"/>
    <path d="M174 481 C245 459 319 346 420 257 C501 188 604 176 672 225 C766 293 828 429 955 475" fill="none" stroke="#68E9D0" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M551 197 V509" stroke="#68E9D0" stroke-width="2" stroke-dasharray="7 8" stroke-opacity=".75"/>
    <circle cx="551" cy="200" r="10" fill="#142E37" stroke="#8FF6DD" stroke-width="4"/>
    <g text-anchor="middle">
      <text x="265" y="197" font-size="23" font-weight="700" fill="#B7C8FF">舒适 / 重复区</text>
      <text x="539" y="162" font-size="24" font-weight="700" fill="#86F4D9">适度挑战区</text>
      <text x="835" y="197" font-size="23" font-weight="700" fill="#FFD19B">过载 / 失控区</text>
      <text x="260" y="552" font-size="18" fill="#C3D2E2">低挑战</text>
      <text x="890" y="552" font-size="18" fill="#C3D2E2">高挑战</text>
      <text x="575" y="595" font-size="22" font-weight="700" fill="#E0EBF7">挑战强度 →</text>
    </g>
    <text x="90" y="345" font-size="22" font-weight="700" fill="#E0EBF7" transform="rotate(-90 90 345)" text-anchor="middle">有效学习程度 →</text>
    <text x="52" y="635" font-size="15" fill="#9EB5C9">Illustrative only. Adjust challenge for feedback, support, recovery, and personal context.</text>
  </g>
</svg>