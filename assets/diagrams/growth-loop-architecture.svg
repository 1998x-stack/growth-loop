<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
  <title id="title">Growth Loop Skill 逻辑架构</title>
  <desc id="desc">三个时间层次汇入五阶段成长循环：选择高价值问题、诊断瓶颈、真实实验、衡量反馈和重新选择；底部用能力扩张、效率提升、问题选择力衡量成长。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0C1426"/><stop offset="1" stop-color="#1A2D44"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#648DFF"/><stop offset=".5" stop-color="#67E9CC"/><stop offset="1" stop-color="#F5BC70"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#79D8CD"/></marker>
  </defs>
  <rect width="1320" height="790" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="50" y="69" fill="#F4F9FF" font-size="42" font-weight="800">Growth Loop</text>
    <text x="51" y="101" fill="#A8C1D5" font-size="17" letter-spacing="1.5">CHOOSE BETTER PROBLEMS. LEARN FROM REALITY.</text>
    <rect x="50" y="117" width="1220" height="5" rx="3" fill="url(#accent)"/>
    <rect x="50" y="147" width="384" height="151" rx="17" fill="#213258" stroke="#708CFB" stroke-width="2"/>
    <rect x="468" y="147" width="384" height="151" rx="17" fill="#173D48" stroke="#63E1C8" stroke-width="2"/>
    <rect x="886" y="147" width="384" height="151" rx="17" fill="#46372E" stroke="#F1BE7E" stroke-width="2"/>
    <text x="74" y="181" fill="#B5C2FF" font-size="16" font-weight="700">01 / SHORT TERM · 短期</text>
    <text x="74" y="225" fill="#FFFFFF" font-size="29" font-weight="700">真实挑战 + 快速反馈</text>
    <text x="74" y="259" fill="#BCCBE5" font-size="18">明确目标，做有反馈的真实任务</text>
    <text x="492" y="181" fill="#8BF4D7" font-size="16" font-weight="700">02 / MID TERM · 中期</text>
    <text x="492" y="225" fill="#FFFFFF" font-size="29" font-weight="700">优势复利 + 突破瓶颈</text>
    <text x="492" y="259" fill="#C1E8E4" font-size="18">聚焦高价值优势，改善关键限制</text>
    <text x="910" y="181" fill="#FFD599" font-size="16" font-weight="700">03 / LONG TERM · 长期</text>
    <text x="910" y="225" fill="#FFFFFF" font-size="29" font-weight="700">持续反思 + 重新选题</text>
    <text x="910" y="259" fill="#EFDBC7" font-size="18">培养自我修正与方向调整习惯</text>
    <g fill="none" stroke="#79D8CD" stroke-opacity=".7" stroke-width="2.5">
      <path d="M242 298 V327"/>
      <path d="M660 298 V327"/>
      <path d="M1078 298 V327"/>
      <path d="M242 327 H1078"/>
      <path d="M660 327 V355" marker-end="url(#arrow)"/>
    </g>
    <text x="50" y="365" font-size="15" fill="#AEBED4" letter-spacing="2">CORE DECISION ENGINE</text>
    <g>
      <rect x="50" y="387" width="225" height="122" rx="16" fill="#243657" stroke="#7A9AFF" stroke-width="2"/>
      <rect x="299" y="387" width="225" height="122" rx="16" fill="#243657" stroke="#7A9AFF" stroke-width="2"/>
      <rect x="548" y="387" width="225" height="122" rx="16" fill="#19434B" stroke="#6CE8CC" stroke-width="2"/>
      <rect x="797" y="387" width="225" height="122" rx="16" fill="#19434B" stroke="#6CE8CC" stroke-width="2"/>
      <rect x="1046" y="387" width="224" height="122" rx="16" fill="#46392E" stroke="#F5BD78" stroke-width="2"/>
    </g>
    <g text-anchor="middle">
      <text x="162" y="425" fill="#B4C5FF" font-size="16">01 / SELECT</text><text x="162" y="470" fill="#FFFFFF" font-weight="700" font-size="28">选对问题</text>
      <text x="411" y="425" fill="#B4C5FF" font-size="16">02 / DIAGNOSE</text><text x="411" y="470" fill="#FFFFFF" font-weight="700" font-size="28">定位瓶颈</text>
      <text x="660" y="425" fill="#91F4E0" font-size="16">03 / EXPERIMENT</text><text x="660" y="470" fill="#FFFFFF" font-weight="700" font-size="28">真实实验</text>
      <text x="909" y="425" fill="#91F4E0" font-size="16">04 / MEASURE</text><text x="909" y="470" fill="#FFFFFF" font-weight="700" font-size="28">衡量反馈</text>
      <text x="1158" y="425" fill="#FFD79B" font-size="16">05 / RECHOOSE</text><text x="1158" y="470" fill="#FFFFFF" font-weight="700" font-size="28">重新选择</text>
    </g>
    <g fill="none" stroke="#79D8CD" stroke-width="2.8" marker-end="url(#arrow)">
      <path d="M277 448 H295"/>
      <path d="M526 448 H544"/>
      <path d="M775 448 H793"/>
      <path d="M1024 448 H1042"/>
    </g>
    <path d="M1158 510 V548 H162 V512" fill="none" stroke="#79D8CD" stroke-width="2.6" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <rect x="50" y="572" width="1220" height="163" rx="19" fill="#131F34" stroke="#465A77" stroke-width="2"/>
    <text x="77" y="607" fill="#B6C7DA" font-size="17" font-weight="700">MEASURE WHAT MATTERS / 三类成长结果</text>
    <path d="M456 625 V708 M866 625 V708" stroke="#43546D" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="252" y="665" font-size="25" font-weight="700" fill="#F2F7FF">0 → 1 · 能力扩张</text>
      <text x="252" y="697" font-size="17" fill="#B5C5DA">原本做不到，现在做到了</text>
      <text x="661" y="665" font-size="25" font-weight="700" fill="#F2F7FF">1 → N · 效率提升</text>
      <text x="661" y="697" font-size="17" fill="#B5C5DA">同等质量，时间或成本更少</text>
      <text x="1069" y="665" font-size="25" font-weight="700" fill="#F2F7FF">选择力 · 更好的问题</text>
      <text x="1069" y="697" font-size="17" fill="#B5C5DA">停止低价值努力，重新配置资源</text>
    </g>
    <text x="50" y="771" fill="#91A9C2" font-size="14">Evidence-informed synthesis · Validate with real tasks; continue / adjust / stop / explore.</text>
  </g>
</svg>